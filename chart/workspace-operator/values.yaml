controllerManager:
  kubeRbacProxy:
    args:
      - --secure-listen-address=0.0.0.0:8443
      - --upstream=http://127.0.0.1:8080/
      - --logtostderr=true
      - --v=0
    containerSecurityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
    image:
      repository: registry.k8s.io/kubebuilder/kube-rbac-proxy
      tag: v0.15.0
    resources:
      limits:
        cpu: 500m
        memory: 128Mi
      requests:
        cpu: 5m
        memory: 64Mi
  manager:
    args:
      - --health-probe-bind-address=:8081
      - --metrics-bind-address=127.0.0.1:8080
      - --leader-elect
    containerSecurityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
    image:
      repository: public.ecr.aws/eodh/workspace-controller
      tag: 0.3.0-rc12
    resources:
      limits:
        cpu: 500m
        memory: 128Mi
      requests:
        cpu: 10m
        memory: 64Mi
    # Extra environment variables for the manager container
    extraEnv: []
    # Extra volume mounts for the manager container, e.g. a Pulsar token
    # secret read via config.pulsar.tokenFile. Do not use subPath for secrets
    # that rotate, as subPath mounts are not updated.
    extraVolumeMounts: []
  # Extra pod volumes, mounted with manager.extraVolumeMounts
  extraVolumes: []
  replicas: 1
  serviceAccount:
    create: true
    name: workspace-controller
    annotations: {}
  # Controller config, rendered to /app/config.yaml. See the README for all keys.
  # config:
  #   pulsar:
  #     url: pulsar://pulsar-proxy.pulsar:6650
  #     tokenFile: /var/run/secrets/pulsar/token
  #     topic: persistent://public/workspaces/workspace-controller
kubernetesClusterDomain: cluster.local
metricsService:
  ports:
    - name: https
      port: 8443
      protocol: TCP
      targetPort: https
  type: ClusterIP
