name: Build and Publish Docker Image

on:
  push:
    tags:
      - v[0-9]+*
    branches:
      - main
jobs:
  security-scan:
    name: Call Security Scan
    permissions:
      contents: read
    uses: EO-DataHub/github-actions/.github/workflows/security.yaml@main
  tag:
    permissions:
        contents: read
    uses: EO-DataHub/github-actions/.github/workflows/get-docker-tag.yaml@main
    with:
      github-ref: ${{ github.ref_name}}
  prechecks:
    name: Prechecks
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - run: |
          RETURN_CODE=0
          if [ -z "${{ vars.IMAGE_NAME }}" ]; then
            echo "Github vars.IMAGE_NAME required for publish"
            RETURN_CODE=1
          fi
          if [ -z "${{ vars.AWS_ROLE_ARN }}" ]; then
            echo "Github vars.AWS_ROLE_ARN required for publish"
            RETURN_CODE=1
          fi
          if [ -z "${{ vars.AWS_ECR_ALIAS }}" ]; then
            echo "Github vars.AWS_ECR_ALIAS required for publish"
            RETURN_CODE=1
          fi
          exit $RETURN_CODE
  publish:
    name: Build and push Docker image
    needs: [tag, prechecks]
    uses: EO-DataHub/github-actions/.github/workflows/ecr-publish.yaml@main
    with:
      image_name: ${{ vars.IMAGE_NAME }}
      image_tag: ${{ needs.tag.outputs.image-tag }}
      aws_role_arn: ${{ vars.AWS_ROLE_ARN }}
      aws_ecr_alias: ${{ vars.AWS_ECR_ALIAS }}
    permissions:
      id-token: write
      contents: read
